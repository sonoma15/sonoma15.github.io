<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin Collection Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <header class="bg-white border-b border-gray-200 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-lock mr-2 text-blue-600"></i> Pin Admin Panel</h1>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-gray-900"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Site</a>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4 max-w-4xl flex-grow">
        <!-- Setup / Auth Card -->
        <div id="auth-card" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-2">GitHub Connection Settings</h2>
            <p class="text-sm text-gray-500 mb-4">Enter your GitHub repository details and a Personal Access Token (PAT) with repo permissions to enable saving changes.</p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">GitHub Username / Owner</label>
                    <input type="text" id="gh-owner" placeholder="e.g. your-username" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Repository Name</label>
                    <input type="text" id="gh-repo" placeholder="e.g. pin-collection" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Personal Access Token</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                </div>
            </div>
            <button onclick="loadPinsFromGitHub()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Connect & Load Pins</button>
        </div>

        <!-- Management Area (Hidden until connected) -->
        <div id="admin-content" class="hidden space-y-6">
            <!-- Add New Pin Form -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Pin</h2>
                <form id="add-pin-form" onsubmit="handleAddNewPin(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Pin Name</label>
                            <input type="text" id="new-name" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Image Path</label>
                            <input type="text" id="new-image" value="Pins/" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Price ($)</label>
                            <input type="number" step="0.01" id="new-price" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">SKU (or N/A)</label>
                            <input type="text" id="new-sku" value="N/A" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description</label>
                        <textarea id="new-desc" rows="2" required class="w-full border border-gray-300 rounded-lg p-2 text-sm"></textarea>
                    </div>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Add Pin to Collection</button>
                </form>
            </div>

            <!-- Existing Pins List -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Existing Pins</h2>
                <div id="pins-list-container" class="divide-y divide-gray-100">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let pins = [];
        let fileSha = '';

        // Load saved credentials from localStorage if available
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('gh_owner')) document.getElementById('gh-owner').value = localStorage.getItem('gh_owner');
            if (localStorage.getItem('gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('gh_repo');
            if (localStorage.getItem('gh_token')) document.getElementById('gh-token').value = localStorage.getItem('gh_token');
        });

        async function loadPinsFromGitHub() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            if (!owner || !repo || !token) {
                alert('Please fill in all GitHub connection fields.');
                return;
            }

            // Save credentials locally for convenience
            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            try {
                const response = `https://api.github.com/repos/${owner}/${repo}/contents/pins.json`;
                const res = await fetch(response, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (!res.ok) throw new Error('Failed to fetch pins.json from GitHub. Check your credentials.');
                
                const data = await res.json();
                fileSha = data.sha;
                pins = JSON.parse(decodeURIComponent(escape(atob(data.content))));

                renderAdminPins();
                document.getElementById('admin-content').classList.remove('hidden');
                alert('Successfully connected to GitHub!');
            } catch (err) {
                alert(err.message);
            }
        }

        function renderAdminPins() {
            const container = document.getElementById('pins-list-container');
            container.innerHTML = '';
            pins.forEach((pin, index) => {
                const div = document.createElement('div');
                div.className = 'py-3 flex items-center justify-between gap-4';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${pin.image}" class="w-10 h-10 object-cover rounded-lg bg-gray-100">
                        <div>
                            <h4 class="text-sm font-semibold text-gray-800">${pin.name}</h4>
                            <p class="text-xs text-gray-500">$${pin.price.toFixed(2)} • SKU: ${pin.sku}</p>
                        </div>
                    </div>
                    <button onclick="deletePin(${index})" class="text-red-600 hover:text-red-800 text-xs font-semibold px-3 py-1.5 bg-red-50 rounded-lg transition-colors">Delete</button>
                `;
                container.appendChild(div);
            });
        }

        async function handleAddNewPin(e) {
            e.preventDefault();
            const newPin = {
                name: document.getElementById('new-name').value.trim(),
                image: document.getElementById('new-image').value.trim(),
                price: parseFloat(document.getElementById('new-price').value),
                sku: document.getElementById('new-sku').value.trim(),
                description: document.getElementById('new-desc').value.trim()
            };

            pins.push(newPin);
            await savePinsToGitHub('Add pin: ' + newPin.name);
            document.getElementById('add-pin-form').reset();
            document.getElementById('new-image').value = 'Pins/';
            document.getElementById('new-sku').value = 'N/A';
        }

        async function deletePin(index) {
            if (!confirm(`Are you sure you want to delete "${pins[index].name}"?`)) return;
            const removed = pins.splice(index, 1);
            await savePinsToGitHub('Delete pin: ' + removed[0].name);
        }

        async function savePinsToGitHub(commitMessage) {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(pins, null, 2))));

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/pins.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || 'Failed to update repository.');
                }

                const data = await res.json();
                fileSha = data.content.sha; // update SHA for next commit
                renderAdminPins();
                alert('Changes saved successfully! GitHub Pages will update in about 30 seconds.');
            } catch (err) {
                alert('Error saving to GitHub: ' + err.message);
            }
        }
    </script>
</body>
</html>
