<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin Collection Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            cursor: pointer;
            background-color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .gallery-item img {
            transition: transform 0.5s ease;
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        .pagination-link {
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            margin: 0 0.25rem;
            border: 1px solid #e5e7eb;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: white;
        }
        .pagination-link:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .pagination-link.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .pagination-link.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-lg">
                    <i class="fa-solid fa-map-pin"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Pin Collection</h1>
                    <p class="text-xs text-gray-500">Personal Souvenir & Memorabilia Showcase</p>
                </div>
            </div>
            <nav class="flex items-center space-x-4">
                <a href="stats.html" class="inline-flex items-center text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 px-3.5 py-2 rounded-lg transition-colors">
                    <i class="fa-solid fa-chart-pie mr-2 text-blue-600"></i> View Statistics
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto py-8 px-4 flex-grow">
        <!-- Gallery Grid Section -->
        <section id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 lg:grid-rows-3 gap-6 mb-8">
            <!-- Dynamic Cards Populated Here -->
        </section>

        <!-- Pagination -->
        <nav id="pagination" class="flex justify-center items-center space-x-1 mb-8">
            <!-- Dynamic Pagination Links Here -->
        </nav>

        <!-- Pin Details View (Hidden by Default) -->
        <div id="pin-details" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8 mt-4 hidden">
            <button id="back-to-gallery" class="inline-flex items-center text-sm font-semibold text-gray-600 hover:text-gray-900 mb-6 transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Gallery
            </button>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                <div id="pin-details-image" class="bg-gray-100 rounded-lg overflow-hidden border border-gray-100">
                    <img src="" alt="" class="w-full h-auto max-h-[400px] object-contain mx-auto">
                </div>
                
                <div class="flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start gap-4 mb-2">
                            <h2 id="pin-details-name" class="text-2xl font-bold text-gray-900"></h2>
                            <span id="pin-details-price" class="text-lg font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full whitespace-nowrap"></span>
                        </div>
                        <p id="pin-details-table-description" class="text-gray-600 text-sm leading-relaxed mb-6"></p>
                    </div>

                    <div class="border-t border-gray-100 pt-4">
                        <h3 class="text-xs font-semibold uppercase text-gray-400 tracking-wider mb-3">Item Specifications</h3>
                        <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg text-sm">
                            <div>
                                <span class="block text-gray-500 text-xs">SKU Number</span>
                                <span id="pin-details-sku" class="font-medium text-gray-800"></span>
                            </div>
                            <div>
                                <span class="block text-gray-500 text-xs">Catalog Name</span>
                                <span id="pin-details-name-table" class="font-medium text-gray-800 truncate block"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-gray-500 text-sm">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 My Pin Collection. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const gallerySection = document.getElementById('gallery');
        const paginationNav = document.getElementById('pagination');
        const pinDetailsSection = document.getElementById('pin-details');
        const pinDetailsName = document.getElementById('pin-details-name');
        const pinDetailsImage = document.getElementById('pin-details-image').querySelector('img');
        const backToGalleryButton = document.getElementById('back-to-gallery');
        const pinDetailsPriceElement = document.getElementById('pin-details-price');
        const pinDetailsSkuElement = document.getElementById('pin-details-sku');
        const pinDetailsTableDescriptionElement = document.getElementById('pin-details-table-description');
        const pinDetailsNameTableElement = document.getElementById('pin-details-name-table');

        const pinsPerPage = 9;
        let currentPage = 1;
        let pins = [];

        async function init() {
            try {
                const response = await fetch('pins.json');
                pins = await response.json();
                
                // Call your render functions here!
                displayPins();       // (for index.html)
                generatePagination(); // (for index.html)
            } catch (error) {
                console.error('Error loading pin data:', error);
            }
        }

        init();

        function displayPins() {
            gallerySection.innerHTML = '';
            const start = (currentPage - 1) * pinsPerPage;
            const end = start + pinsPerPage;
            const currentPins = pins.slice(start, end);

            currentPins.forEach(pin => {
                const pinElement = document.createElement('div');
                pinElement.className = 'gallery-item';
                pinElement.innerHTML = `
                    <div class="overflow-hidden relative">
                        <img src="${pin.image}" alt="${pin.name}">
                        <span class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm text-gray-900 font-bold text-xs px-2.5 py-1 rounded-full shadow-sm">$${pin.price.toFixed(2)}</span>
                    </div>
                    <div class="p-4">
                        <h3 class="text-base font-semibold text-gray-800 mb-1 truncate">${pin.name}</h3>
                        <p class="text-gray-500 text-xs line-clamp-2">${pin.description}</p>
                    </div>
                `;
                pinElement.addEventListener('click', () => showPinDetails(pin));
                gallerySection.appendChild(pinElement);
            });
        }

        function generatePagination() {
            paginationNav.innerHTML = '';
            const totalPages = Math.ceil(pins.length / pinsPerPage);

            const prevLink = document.createElement('a');
            prevLink.className = `pagination-link ${currentPage === 1 ? 'disabled' : ''}`;
            prevLink.innerHTML = '<i class="fa-solid fa-chevron-left text-xs"></i>';
            prevLink.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayPins();
                    generatePagination();
                }
            });
            paginationNav.appendChild(prevLink);

            for (let i = 1; i <= totalPages; i++) {
                const pageLink = document.createElement('a');
                pageLink.className = `pagination-link ${currentPage === i ? 'active' : ''}`;
                pageLink.textContent = i;
                pageLink.addEventListener('click', () => {
                    currentPage = i;
                    displayPins();
                    generatePagination();
                });
                paginationNav.appendChild(pageLink);
            }

            const nextLink = document.createElement('a');
            nextLink.className = `pagination-link ${currentPage === totalPages ? 'disabled' : ''}`;
            nextLink.innerHTML = '<i class="fa-solid fa-chevron-right text-xs"></i>';
            nextLink.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    displayPins();
                    generatePagination();
                }
            });
            paginationNav.appendChild(nextLink);
        }

        function showPinDetails(pin) {
            pinDetailsName.textContent = pin.name;
            pinDetailsImage.src = pin.image;
            pinDetailsImage.alt = pin.name;
            pinDetailsPriceElement.textContent = `$${pin.price.toFixed(2)}`;
            pinDetailsSkuElement.textContent = pin.sku;
            pinDetailsTableDescriptionElement.textContent = pin.description;
            pinDetailsNameTableElement.textContent = pin.name;
            
            gallerySection.classList.add('hidden');
            paginationNav.classList.add('hidden');
            pinDetailsSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        backToGalleryButton.addEventListener('click', () => {
            pinDetailsSection.classList.add('hidden');
            gallerySection.classList.remove('hidden');
            paginationNav.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        displayPins();
        generatePagination();
    </script>
</body>
</html>
